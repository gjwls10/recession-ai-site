<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1분 투자 챌린지</title>
<style>
/* ===== 색상 ===== */
:root {
  --bg: #0d1424;
  --panel: #16203a;
  --panel2: #1e2a4a;
  --line: #2c3a60;
  --text: #eef2fb;
  --muted: #93a0c0;
  --accent: #ffcc33;
  --up: #ff4d4f;     /* 상승 = 빨강 */
  --down: #3d8bff;   /* 하락 = 파랑 */
  --flat: #a8b0c4;
  --danger-bg: #3a1a1c;
  --practice: #3ecf8e;      /* 연습 모드 강조색 */
  --practice-bg: #15322a;
  color-scheme: dark;
}

/* ===== 공통 ===== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 18px;
}
button { font: inherit; cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; min-height: 100%; }
.screen { display: none; }
.screen.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }

.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

.btn {
  border: 0; border-radius: 14px; padding: 16px 28px;
  background: var(--accent); color: #1a1a1a; font-weight: 800; font-size: 22px;
}
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-size: 15px; padding: 8px 14px; font-weight: 500; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.card h2 { margin: 0 0 14px; font-size: 22px; }
.center { text-align: center; margin-top: 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill { background: var(--panel2); border-radius: 999px; padding: 8px 18px; font-weight: 700; }
.pill b { color: var(--accent); }

/* ===== 시작 화면 ===== */
.hero { text-align: center; padding: 30px 0 10px; }
.hero h1 { font-size: 64px; margin: 0; letter-spacing: -2px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--muted); font-size: 21px; margin: 12px 0 0; }
.start-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; margin-top: 30px; }
.nick-row { display: flex; gap: 10px; }
.nick-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 24px; padding: 14px 16px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--bg); color: var(--text); outline: none;
}
.nick-row input:focus { border-color: var(--accent); }
.msg { color: var(--up); min-height: 24px; margin-top: 8px; font-size: 16px; }
.rules { margin: 6px 0 0; padding-left: 22px; line-height: 1.75; color: #cfd6ea; }
.gift-note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #2b2a1a; color: var(--accent); font-weight: 700; }
.admin { margin-top: 26px; display: flex; gap: 10px; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; flex-wrap: wrap; }

[hidden] { display: none !important; }
.btn.ghost.danger { color: var(--up); border-color: var(--up); background: var(--danger-bg); }
.btn:focus-visible, .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.export { margin-top: 18px; }
.export-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.export-head h2 { margin: 0; }
.export-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.export-msg { color: var(--muted); font-size: 15px; margin: 12px 0 8px; }
.export textarea {
  width: 100%; height: 160px; resize: vertical; font: 13px/1.5 ui-monospace, Consolas, monospace;
  background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  white-space: pre; overflow: auto;
}

/* ===== 모드 ===== */
.mode-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 12px; }
.mode-row .btn { font-size: 19px; padding: 14px 12px; }
.btn.practice-btn { background: var(--practice-bg); color: var(--practice); border: 2px solid var(--practice); }
.mode-pill { background: var(--danger-bg); color: var(--up); }
body.practice .mode-pill { background: var(--practice-bg); color: var(--practice); }
body.practice .news .tag { background: var(--practice); color: #06281b; }
#resMode { color: var(--up); margin: 6px 0 0; font-size: 18px; font-weight: 700; }
body.practice #resMode { color: var(--practice); }

/* ===== 순위표 ===== */
table.rank { width: 100%; border-collapse: collapse; font-size: 19px; }
table.rank td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
table.rank td.no { width: 48px; font-weight: 800; color: var(--muted); }
table.rank td.rate { text-align: right; font-weight: 800; }
table.rank td.money { text-align: right; color: var(--muted); font-size: 16px; }
table.rank tr.me td { background: #3a3415; }
table.rank tr.me td.no { color: var(--accent); }
table.rank tr.gap td { text-align: center; color: var(--muted); border-bottom: 0; padding: 2px; }
.empty { color: var(--muted); padding: 10px 0; }

/* ===== 라운드 화면 ===== */
.timer { margin: 16px 0 18px; }
.timer-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 16px; margin-bottom: 6px; }
.timer-head b { font-size: 26px; color: var(--text); }
.timer-head b.hurry { color: var(--up); }
.bar { height: 14px; background: var(--panel2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 999px; }
.bar i.hurry { background: var(--up); }

.news { background: #fff; color: #111; border-radius: 18px; padding: 22px 26px; position: relative; }
.news .tag { display: inline-block; background: var(--up); color: #fff; font-weight: 900; padding: 4px 12px; border-radius: 6px; font-size: 16px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.news .cat { display: inline-block; margin-left: 6px; padding: 4px 12px; border-radius: 6px; background: #eef1f7; color: #3b4566; font-weight: 700; font-size: 16px; }
.news h2 { font-size: 34px; margin: 12px 0 6px; letter-spacing: -1px; }
.news p { margin: 0; color: #444; font-size: 19px; }

.choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
.choice {
  background: var(--panel); border: 2px solid var(--line); border-radius: 16px; color: var(--text);
  padding: 16px 10px; text-align: center; position: relative;
}
.choice:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.choice:disabled { opacity: .5; cursor: default; }
.choice .emo { font-size: 38px; display: block; }
.choice .nm { font-size: 21px; font-weight: 800; display: block; margin-top: 4px; }
.choice .sec { font-size: 15px; color: var(--muted); }
.choice .key { position: absolute; top: 8px; left: 10px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.choice.cash { background: #1d2b26; border-color: #2f4a40; }

/* ===== 등락률 공개 화면 ===== */
.result-hero { text-align: center; padding: 18px 0 8px; }
.result-hero .sub { color: var(--muted); font-size: 19px; }
.result-hero .big { font-size: 64px; font-weight: 900; margin: 6px 0; letter-spacing: -2px; }
.result-hero .money { font-size: 24px; }
.moves { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin: 22px 0; }
.move { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; animation: pop .35s ease both; }
.move.picked { border-color: var(--accent); box-shadow: 0 0 0 3px #ffcc3333; }
.move .emo { font-size: 28px; }
.move .nm { font-size: 15px; font-weight: 700; margin-top: 2px; }
.move .chg { font-size: 22px; font-weight: 900; margin-top: 4px; }
.why { background: var(--panel2); border-radius: 14px; padding: 16px 20px; line-height: 1.6; color: #d9dff0; }
.why b { color: var(--accent); }

/* ===== 최종 결과 화면 ===== */
.final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 18px; }
.title-badge { font-size: 40px; font-weight: 900; margin: 6px 0; }
.title-desc { color: var(--muted); }
.stat { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 20px; }
.stat b { font-size: 26px; }
.history { margin-top: 12px; font-size: 16px; color: #cfd6ea; line-height: 1.8; }
.gift { margin-top: 16px; padding: 16px; border-radius: 14px; background: linear-gradient(90deg, #ffcc33, #ff8a3d); color: #1a1a1a; font-weight: 900; font-size: 22px; text-align: center; animation: pop .5s ease; }
.nogift { margin-top: 16px; padding: 12px; border-radius: 14px; background: var(--panel2); color: var(--muted); text-align: center; }

/* ===== 좁은 화면 ===== */
@media (max-width: 860px) {
  .start-grid, .final-grid, .mode-row { grid-template-columns: 1fr; }
  .choices { grid-template-columns: repeat(2, 1fr); }
  .moves { grid-template-columns: repeat(4, 1fr); }
  .hero h1 { font-size: 44px; }
}

</style>
</head>
<body>
<div class="wrap">

  <!-- 시작 화면 -->
  <section id="start" class="screen active">
    <div class="hero">
      <h1>📈 1분 <span>투자 챌린지</span></h1>

    </div>
    <div class="start-grid">
      <div class="card">
        <h2>닉네임 입력</h2>
        <div class="nick-row">
          <input id="nick" maxlength="10" placeholder="최대 10글자" autocomplete="off">
        </div>
        <div class="mode-row">
          <button class="btn" id="hardBtn">🔥 하드 모드 시작</button>
          <button class="btn practice-btn" id="practiceBtn">연습 모드</button>
        </div>
        <div class="msg" id="nickMsg"></div>
        <ul class="rules" id="rules"></ul>

      </div>
      <div class="card">
        <h2>🏆 오늘의 TOP 5 · 하드 모드</h2>
        <div id="startRank"></div>
      </div>
    </div>
    <div class="admin">
      <span id="todayCount"></span>
      <button class="btn ghost" id="csvBtn">기록 CSV 내보내기</button>
      <button class="btn ghost" id="resetBtn">오늘 기록 초기화</button>
    </div>
    <div class="card export" id="exportPanel" hidden>
      <div class="export-head">
        <h2>오늘 기록</h2>
        <div class="export-actions">
          <button class="btn ghost" id="copyBtn">엑셀용으로 복사</button>
          <button class="btn ghost" id="saveBtn">CSV 파일 저장</button>
          <button class="btn ghost" id="closeExportBtn">닫기</button>
        </div>
      </div>
      <p class="export-msg" id="exportMsg"></p>
      <textarea id="exportText" readonly spellcheck="false"></textarea>
    </div>
  </section>

  <!-- 라운드 화면 -->
  <section id="round" class="screen">
    <div class="topbar">
      <span class="pill" id="roundLabel"></span>
      <span class="pill mode-pill" id="modeLabel"></span>
      <span class="pill">👤 <span id="playerName"></span></span>
      <span class="pill">보유 자산 <b id="moneyNow"></b></span>
    </div>
    <div class="timer">
      <div class="timer-head"><span>남은 시간 (선택 안 하면 현금 보유)</span><b id="timeText"></b></div>
      <div class="bar"><i id="timeBar"></i></div>
    </div>
    <div class="news">
      <span class="tag">속보</span> <span class="cat" id="newsCat"></span>
      <h2 id="newsTitle"></h2>
      <p id="newsBody"></p>
    </div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- 등락률 공개 화면 -->
  <section id="reveal" class="screen">
    <div class="topbar">
      <span class="pill" id="revealRound"></span>
      <span class="pill">👤 <span id="revealName"></span></span>
    </div>
    <div class="result-hero">
      <div class="sub" id="revealPick"></div>
      <div class="big" id="revealChange"></div>
      <div class="money" id="revealMoney"></div>
    </div>
    <div class="moves" id="moves"></div>
    <div class="why" id="why"></div>
    <div class="center"><button class="btn" id="nextBtn"></button></div>
  </section>

  <!-- 최종 결과 화면 -->
  <section id="result" class="screen">
    <div class="hero" style="padding-top:10px">
      <h1 style="font-size:48px">🎉 <span id="resName"></span> 님의 결과</h1>
      <p id="resMode"></p>
    </div>
    <div class="final-grid">
      <div class="card">
        <div class="title-desc">나의 투자 성향</div>
        <div class="title-badge" id="resTitle"></div>
        <div class="title-desc" id="resTitleDesc"></div>
        <div class="stat"><span>최종 자산</span><b id="resMoney"></b></div>
        <div class="stat"><span>수익률</span><b id="resRate"></b></div>
        <div class="history" id="resHistory"></div>
        <div id="giftBox"></div>
      </div>
      <div class="card">
        <h2>🏆 오늘의 TOP 5 · 하드 모드</h2>
        <div id="resRank"></div>
      </div>
    </div>
    <div class="center"><button class="btn" id="againBtn">다음 체험자 ▶</button></div>
  </section>

</div>

<script>
// =====================================================================
// 1. 데이터 꺼내기 (maingame.py 가 넣어 준 GAME 객체)
// =====================================================================
const CFG = GAME.config;
const STOCKS = GAME.stocks;
const PRACTICE_NEWS = GAME.practiceNews;
const HARD_NEWS = GAME.hardNews;
const TITLES = GAME.titles;
const CASH_TITLE = GAME.cashTitle;

// =====================================================================
// 2. 도우미 함수
// =====================================================================
const $ = (id) => document.getElementById(id);
const won = (n) => Math.round(n).toLocaleString("ko-KR") + "원";
const signedWon = (n) => (n > 0 ? "+" : n < 0 ? "-" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR") + "원";
const pct = (n) => (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const tone = (n) => (n > 0 ? "up" : n < 0 ? "down" : "flat");
const round1 = (n) => Math.round(n * 10) / 10;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stockById = (id) => STOCKS.find((s) => s.id === id);
const MODE_LABEL = { practice: "연습 모드", hard: "하드 모드" };

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const randomOf = (arr) => arr[Math.floor(Math.random() * arr.length)];

// 연습 모드 뉴스 뽑기: 뉴스 중 count 개를 똑같은 확률로 뽑음
function pickPracticeNews(pool, count) {
  return shuffle(pool.slice()).slice(0, count);
}

// 하드 모드 뉴스 뽑기:
//   1) 분야 중 count 개를 똑같은 확률로 뽑고 (순서도 무작위)
//   2) 뽑힌 분야마다 그 분야 뉴스 중 하나를 똑같은 확률로 뽑음
//   → 분야가 겹치지 않고, 뉴스 하나가 나올 확률 = (count / 분야 수) × (1 / 그 분야 뉴스 수)
function pickHardNews(pool, count) {
  const categories = shuffle([...new Set(pool.map((n) => n.category))]);
  const picked = categories.slice(0, count).map((c) => randomOf(pool.filter((n) => n.category === c)));
  // 분야 수가 라운드 수보다 적을 때만: 남은 뉴스로 채움
  const rest = shuffle(pool.filter((n) => !picked.includes(n)));
  while (picked.length < count && rest.length) picked.push(rest.pop());
  return picked;
}

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
}

// =====================================================================
// 3. 기록 저장 (브라우저 localStorage, 오늘 날짜별) - 하드 모드만 기록
// =====================================================================
let memRecords = [];   // localStorage 를 못 쓰는 환경을 위한 예비 저장소

function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
const storeKey = () => "investChallenge2:" + todayStr();

function loadRecords() {
  try {
    const v = localStorage.getItem(storeKey());
    if (v) return JSON.parse(v);
  } catch (e) {}
  return memRecords.slice();
}

function saveRecords(recs) {
  memRecords = recs.slice();
  try { localStorage.setItem(storeKey(), JSON.stringify(recs)); } catch (e) {}
}

function sortedRecords() {
  return loadRecords().sort((a, b) => b.final - a.final || a.time.localeCompare(b.time));
}

// =====================================================================
// 4. 순위표 그리기 (하드 모드)
// =====================================================================
function renderRank(target, myId) {
  const recs = sortedRecords();
  if (!recs.length) {
    $(target).innerHTML = '<div class="empty">아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</div>';
    return;
  }
  const medal = ["🥇", "🥈", "🥉", "4", "5"];
  const row = (r, i) =>
    `<tr class="${r.id === myId ? "me" : ""}"><td class="no">${i < 5 ? medal[i] : i + 1}</td>` +
    `<td>${esc(r.name)}${r.id === myId ? " (나)" : ""}</td>` +
    `<td class="money">${won(r.final)}</td><td class="rate ${tone(r.rate)}">${pct(r.rate)}</td></tr>`;
  let html = '<table class="rank">' + recs.slice(0, 5).map(row).join("");
  const myIdx = recs.findIndex((r) => r.id === myId);
  if (myIdx >= 5) html += '<tr class="gap"><td colspan="4">⋮</td></tr>' + row(recs[myIdx], myIdx);
  html += "</table>";
  if (myIdx >= 0) html += `<div class="empty">오늘 하드 모드 참가자 ${recs.length}명 중 <b>${myIdx + 1}위</b></div>`;
  $(target).innerHTML = html;
}

function refreshStart() {
  renderRank("startRank", null);
  $("todayCount").textContent = `오늘(${todayStr()}) 하드 모드 참가자 ${loadRecords().length}명`;
}

// =====================================================================
// 5. 게임 진행: 시작 → 라운드 → 선택 → 공개
// =====================================================================
let state = null;

function startGame(mode) {
  const name = $("nick").value.trim();
  if (!name) {
    $("nickMsg").textContent = "닉네임을 입력해 주세요!";
    $("nick").focus();
    return;
  }
  $("nickMsg").textContent = "";
  state = {
    name,
    mode,
    money: CFG.startMoney,
    round: 0,
    news: mode === "practice" ? pickPracticeNews(PRACTICE_NEWS, CFG.rounds) : pickHardNews(HARD_NEWS, CFG.rounds),
    log: [],
    picked: false,
    timer: null,
  };
  state.rounds = state.news.length;
  document.body.classList.toggle("practice", mode === "practice");
  startRound();
}

function startRound() {
  const n = state.news[state.round];
  state.picked = false;
  $("roundLabel").textContent = `ROUND ${state.round + 1} / ${state.rounds}`;
  $("modeLabel").textContent = MODE_LABEL[state.mode];
  $("playerName").textContent = state.name;
  $("moneyNow").textContent = won(state.money);
  $("newsCat").textContent = n.category;
  $("newsTitle").textContent = n.title;
  $("newsBody").textContent = n.body;
  document.querySelectorAll(".choice").forEach((b) => (b.disabled = false));
  show("round");

  // 제한 시간 타이머 (0.1초마다 갱신, 시간이 다 되면 현금 보유)
  state.roundStart = performance.now();
  const limit = CFG.timeLimit * 1000;
  const tick = () => {
    const left = Math.max(0, limit - (performance.now() - state.roundStart));
    const hurry = left <= 5000;
    $("timeText").textContent = Math.ceil(left / 1000) + "초";
    $("timeText").classList.toggle("hurry", hurry);
    $("timeBar").style.width = (left / limit) * 100 + "%";
    $("timeBar").classList.toggle("hurry", hurry);
    if (left <= 0) pick("cash", true);
  };
  tick();
  state.timer = setInterval(tick, 100);
}

function pick(choiceId, timeout) {
  if (!state || state.picked) return;
  state.picked = true;
  clearInterval(state.timer);
  document.querySelectorAll(".choice").forEach((b) => (b.disabled = true));

  // 등락률 = 뉴스에 정해 둔 값 그대로 (무작위 없음 → 같은 선택이면 항상 같은 결과)
  const n = state.news[state.round];
  const changes = {};
  STOCKS.forEach((s) => {
    changes[s.id] = n.fx[s.id] || 0;
  });
  const change = choiceId === "cash" ? 0 : changes[choiceId];
  const before = state.money;
  state.money = Math.round(before * (1 + change / 100));
  state.log.push({
    news: n.title,
    category: n.category,
    pick: choiceId === "cash" ? "현금 보유" : stockById(choiceId).name,
    timeout: !!timeout,
    secs: round1(Math.min(CFG.timeLimit, (performance.now() - state.roundStart) / 1000)),
    change,
    before,
    after: state.money,
  });
  showReveal(choiceId, changes, change, before, timeout);
}

function showReveal(choiceId, changes, change, before, timeout) {
  const n = state.news[state.round];
  $("revealRound").textContent = `ROUND ${state.round + 1} / ${state.rounds} 결과`;
  $("revealName").textContent = state.name;
  if (choiceId === "cash") {
    $("revealPick").textContent = timeout ? "⏰ 시간 초과! 현금 보유로 처리되었어요" : "💵 현금 보유를 선택했어요";
  } else {
    const s = stockById(choiceId);
    $("revealPick").textContent = `${s.emo} ${s.name} (${s.sector})에 투자했어요`;
  }
  $("revealChange").textContent = pct(change);
  $("revealChange").className = "big " + tone(change);
  const diff = state.money - before;
  $("revealMoney").innerHTML = `보유 자산 ${won(before)} → <b>${won(state.money)}</b> <span class="${tone(diff)}">(${signedWon(diff)})</span>`;

  $("moves").innerHTML = STOCKS.map((s, i) =>
    `<div class="move ${s.id === choiceId ? "picked" : ""}" style="animation-delay:${i * 0.08}s">` +
    `<div class="emo">${s.emo}</div><div class="nm">${s.name}</div>` +
    `<div class="chg ${tone(changes[s.id])}">${pct(changes[s.id])}</div></div>`
  ).join("");
  $("why").innerHTML = "💡 <b>왜 그럴까?</b> " + n.why;
  $("nextBtn").textContent = state.round + 1 < state.rounds ? "다음 라운드 ▶" : "최종 결과 보기 ▶";
  state.revealAt = performance.now();
  show("reveal");
}

function nextStep() {
  state.round++;
  if (state.round < state.rounds) startRound();
  else finish();
}

// =====================================================================
// 6. 최종 결과: 칭호, 선물, 기록 저장, 순위
//    연습 모드는 기록·순위·선물 없이 결과만 보여 줌
// =====================================================================
function titleFor(rate, log) {
  if (log.every((l) => l.pick === "현금 보유")) return CASH_TITLE;
  return TITLES.find((t) => t.min === null || rate >= t.min);
}

function finish() {
  const rate = round1(((state.money - CFG.startMoney) / CFG.startMoney) * 100);
  const title = titleFor(rate, state.log);
  const practice = state.mode === "practice";
  let myId = null;

  if (!practice) {
    const rec = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      name: state.name,
      final: state.money,
      rate,
      title: title.name,
      time: new Date().toISOString(),
      log: state.log,
    };
    const recs = loadRecords();
    recs.push(rec);
    saveRecords(recs);
    myId = rec.id;
  }

  $("resName").textContent = state.name;
  $("resMode").textContent = MODE_LABEL[state.mode];
  $("resTitle").textContent = title.name;
  $("resTitleDesc").textContent = title.desc;
  $("resMoney").textContent = won(state.money);
  $("resRate").textContent = pct(rate);
  $("resRate").className = tone(rate);
  $("resHistory").innerHTML = state.log.map((l, i) =>
    `R${i + 1}. ${esc(l.pick)}${l.timeout ? " (시간 초과)" : ""} <span class="${tone(l.change)}">${pct(l.change)}</span>`
  ).join("<br>");
  if (practice) {
    $("giftBox").innerHTML = '<div class="nogift">연습 모드는 선물과 순위가 없어요. 이제 <b>하드 모드</b>에 도전해 보세요!</div>';
  } else {
    $("giftBox").innerHTML = rate >= CFG.giftRate
      ? `<div class="gift">🎁 수익률 ${CFG.giftRate}% 달성! 진행자에게 이 화면을 보여주세요</div>`
      : `<div class="nogift">선물 기준 수익률 ${CFG.giftRate}%까지 ${(CFG.giftRate - rate).toFixed(1)}%p 남았어요. 다시 도전!</div>`;
  }
  renderRank("resRank", myId);
  show("result");
}

function nextPlayer() {
  state = null;
  document.body.classList.remove("practice");
  $("nick").value = "";
  refreshStart();
  show("start");
  $("nick").focus();
}

// =====================================================================
// 7. 운영자 기능: 기록 내보내기, 오늘 기록 초기화 (하드 모드 기록)
// =====================================================================
function recordRows() {
  const head = ["시간", "닉네임", "최종자산", "수익률(%)", "칭호"];
  for (let i = 1; i <= CFG.rounds; i++) head.push(`R${i} 뉴스`, `R${i} 선택`, `R${i} 등락률(%)`, `R${i} 소요시간(초)`, `R${i} 시간초과`);
  const rows = [head];
  loadRecords().forEach((r) => {
    const row = [new Date(r.time).toLocaleString("ko-KR"), r.name, r.final, r.rate, r.title];
    for (let i = 0; i < CFG.rounds; i++) {
      const l = r.log[i] || {};
      row.push(l.news ?? "", l.pick ?? "", l.change ?? "", l.secs ?? "", l.news ? (l.timeout ? "Y" : "N") : "");
    }
    rows.push(row);
  });
  return rows;
}

function toCsv(rows) {
  const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  return rows.map((r) => r.map(q).join(",")).join("\r\n");
}

// 엑셀에 붙여넣으면 칸이 바로 나뉘도록 탭으로 구분
function toTsv(rows) {
  return rows.map((r) => r.map((v) => String(v).replace(/[\t\r\n]/g, " ")).join("\t")).join("\n");
}

function openExport() {
  const rows = recordRows();
  $("exportPanel").hidden = false;
  $("exportText").value = toTsv(rows);
  $("exportMsg").textContent = rows.length > 1
    ? `하드 모드 기록 ${rows.length - 1}건. "엑셀용으로 복사"를 누른 뒤 엑셀 첫 칸에 붙여넣으세요. (공유 링크에서는 파일 저장이 막혀 있을 수 있어요)`
    : "오늘 하드 모드 기록이 아직 없어요.";
  $("exportPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function copyExport() {
  const text = $("exportText").value;
  try {
    await navigator.clipboard.writeText(text);
    $("exportMsg").textContent = "복사했어요. 엑셀 첫 칸(A1)에 붙여넣으세요.";
  } catch (e) {
    $("exportText").focus();
    $("exportText").select();
    $("exportMsg").textContent = "자동 복사가 막혀 있어요. 아래 글자가 선택되었으니 Ctrl+C 로 복사하세요.";
  }
}

function saveCsvFile() {
  const blob = new Blob(["﻿" + toCsv(recordRows())], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `invest_records_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 초기화는 버튼을 4초 안에 두 번 눌러야 실행 (실수 방지)
let resetArmed = null;
function resetToday() {
  const btn = $("resetBtn");
  if (!resetArmed) {
    btn.textContent = `정말 ${loadRecords().length}건을 지울까요? 한 번 더 누르기`;
    btn.classList.add("danger");
    resetArmed = setTimeout(disarmReset, 4000);
    return;
  }
  disarmReset();
  memRecords = [];
  try { localStorage.removeItem(storeKey()); } catch (e) {}
  $("exportPanel").hidden = true;
  refreshStart();
}

function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = null;
  $("resetBtn").textContent = "오늘 기록 초기화";
  $("resetBtn").classList.remove("danger");
}

// =====================================================================
// 8. 초기화: 화면 문구, 종목 버튼, 버튼·키보드 연결
// =====================================================================
function init() {
  $("startMoneyLabel").textContent = won(CFG.startMoney);
  $("rules").innerHTML = [
    `총 <b>${CFG.rounds}라운드</b>, 라운드마다 뉴스 속보가 나와요. 같은 뉴스에서 같은 종목을 고르면 결과는 항상 같아요.`,
    `<b>연습 모드</b>는 정답이 분명한 뉴스 ${PRACTICE_NEWS.length}개로 연습해요. 선물과 순위는 없어요.`,
    `<b>하드 모드</b>는 뉴스 ${HARD_NEWS.length}개 중에서 나오고, 순위와 선물이 있어요.`,
    `<b>${CFG.timeLimit}초</b> 안에 오를 것 같은 종목 1개 또는 현금 보유를 고르세요.`,
    `<span class="up">빨강 = 상승</span>, <span class="down">파랑 = 하락</span>`,
  ].map((t) => `<li>${t}</li>`).join("");
  $("giftNote").textContent = `🎁 하드 모드 최종 수익률 ${CFG.giftRate}% 이상이면 선물 증정! (연습 모드는 선물 없음)`;

  const choices = $("choices");
  STOCKS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="key">${i + 1}</span><span class="emo">${s.emo}</span><span class="nm">${s.name}</span><span class="sec">${s.sector}</span>`;
    b.onclick = () => pick(s.id, false);
    choices.appendChild(b);
  });
  const cash = document.createElement("button");
  cash.className = "choice cash";
  cash.innerHTML = '<span class="key">0</span><span class="emo">💵</span><span class="nm">현금 보유</span><span class="sec">수익 0%</span>';
  cash.onclick = () => pick("cash", false);
  choices.appendChild(cash);

  $("hardBtn").onclick = () => startGame("hard");
  $("practiceBtn").onclick = () => startGame("practice");
  $("nick").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) startGame("hard"); });
  $("nextBtn").onclick = nextStep;
  $("againBtn").onclick = nextPlayer;
  $("csvBtn").onclick = openExport;
  $("copyBtn").onclick = copyExport;
  $("saveBtn").onclick = saveCsvFile;
  $("closeExportBtn").onclick = () => { $("exportPanel").hidden = true; };
  $("resetBtn").onclick = resetToday;

  // 키보드: 라운드 중 1~7 종목, 0 현금 / 결과 공개 후 Enter 다음
  document.addEventListener("keydown", (e) => {
    const active = document.querySelector(".screen.active").id;
    if (active === "round" && /^[0-7]$/.test(e.key)) {
      pick(e.key === "0" ? "cash" : STOCKS[Number(e.key) - 1].id, false);
    } else if (active === "reveal" && e.key === "Enter" && performance.now() - state.revealAt > 700) {
      e.preventDefault();
      nextStep();
    }
  });

  refreshStart();
  $("nick").focus();
}

init();

</script>
