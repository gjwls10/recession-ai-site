<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 타로</title>
<style>
  :root {
    --bg: #130f26;
    --panel: #1f1840;
    --panel2: #2a2154;
    --line: #3d3270;
    --text: #f3eefe;
    --muted: #a99fcc;
    --gold: #e8c372;
    --topic: #e8c372;          /* 고른 운세의 색 (아래에서 바뀜) */
    --card-face: #fbf6ea;
    --card-ink: #2b2140;
    color-scheme: dark;
  }
  body[data-topic="love"]  { --topic: #ff8fb8; }
  body[data-topic="study"] { --topic: #7cc0ff; }
  body[data-topic="money"] { --topic: #8fe0a0; }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #2b2160 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 18px;
  }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .btn { border: 0; border-radius: 14px; padding: 14px 26px; font-weight: 800; font-size: 20px;
         background: var(--gold); color: #241a00; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
  .btn:focus-visible, .topic:focus-visible, .back:focus-visible, .slot:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .center { text-align: center; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }

  /* 시작 화면 */
  .hero { text-align: center; padding: 28px 0 8px; }
  .hero .moon { font-size: 64px; }
  .hero h1 { font-size: 60px; margin: 6px 0 0; letter-spacing: -1px; color: var(--gold); }
  .hero p { color: var(--muted); font-size: 21px; margin: 12px 0 0; }
  .topics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 36px; }
  .topic {
    background: var(--panel); border: 2px solid var(--line); border-radius: 22px; color: var(--text);
    padding: 30px 16px; text-align: center; transition: transform .15s, border-color .15s;
  }
  .topic:hover { transform: translateY(-4px); }
  .topic .emo { font-size: 54px; display: block; }
  .topic .nm { font-size: 30px; font-weight: 900; display: block; margin-top: 8px; }
  .topic .ds { color: var(--muted); font-size: 17px; }
  .topic.love:hover  { border-color: #ff8fb8; }
  .topic.study:hover { border-color: #7cc0ff; }
  .topic.money:hover { border-color: #8fe0a0; }
  .note { text-align: center; color: var(--muted); font-size: 14px; margin-top: 28px; }

  /* 카드 고르기 */
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill { background: var(--panel2); border-radius: 999px; padding: 8px 18px; font-weight: 800; color: var(--topic); }
  .guide { text-align: center; margin: 22px 0 6px; font-size: 24px; font-weight: 800; }
  .guide small { display: block; font-size: 16px; color: var(--muted); font-weight: 500; margin-top: 6px; }
  .count { text-align: center; color: var(--topic); font-weight: 800; font-size: 20px; margin-bottom: 18px; }
  .deck { display: grid; grid-template-columns: repeat(11, 1fr); gap: 10px; }
  .back {
    aspect-ratio: 2 / 3; border-radius: 10px; border: 2px solid var(--gold);
    background:
      radial-gradient(circle at 50% 50%, transparent 28%, rgba(232,195,114,.25) 29%, transparent 31%),
      repeating-linear-gradient(45deg, #2a2154 0 8px, #241c49 8px 16px);
    position: relative; transition: transform .2s, opacity .3s, box-shadow .2s;
    animation: deal .4s ease both;
  }
  .back::after { content: "✦"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--gold); font-size: 22px; }
  .back:hover:not(:disabled) { transform: translateY(-8px); box-shadow: 0 8px 20px rgba(0,0,0,.4); }
  .back.chosen { transform: translateY(-14px); box-shadow: 0 0 0 4px var(--topic), 0 10px 24px rgba(0,0,0,.5); }
  .back:disabled { cursor: default; }
  .back.dim { opacity: .35; }
  @keyframes deal { from { opacity: 0; transform: translateY(-30px) rotate(-6deg); } to { opacity: 1; transform: none; } }

  /* 결과 */
  .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 22px; }
  .slot-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
  .pos { font-weight: 800; color: var(--topic); font-size: 19px; }
  .slot { width: 100%; max-width: 220px; aspect-ratio: 2 / 3; perspective: 1000px; cursor: pointer; border-radius: 14px; }
  .slot.open { cursor: default; }
  .flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.7,.2,1); }
  .slot.open .flip { transform: rotateY(180deg); }
  .face, .cover { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; }
  .cover {
    border: 3px solid var(--gold);
    background:
      radial-gradient(circle at 50% 50%, transparent 28%, rgba(232,195,114,.3) 29%, transparent 31%),
      repeating-linear-gradient(45deg, #2a2154 0 10px, #241c49 10px 20px);
    display: grid; place-items: center; color: var(--gold); font-size: 15px; font-weight: 700;
  }
  .face {
    transform: rotateY(180deg); transition: transform .7s cubic-bezier(.4,.1,.2,1); background: var(--card-face); color: var(--card-ink);
    border: 3px solid var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 14px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .face .inner { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; width: 100%; }
  /* 역방향: 앞면으로 뒤집힌 뒤 카드 전체가 180° 돌아 거꾸로 놓임 */
  .slot.turned .face { transform: rotateY(180deg) rotateZ(180deg); }
  .orient { visibility: hidden; font-size: 15px; font-weight: 800; padding: 5px 14px; border-radius: 999px; }
  .orient.show { visibility: visible; animation: fade .3s ease; }
  .orient.up { background: #2d4a35; color: #9fe6b0; }
  .orient.rev { background: #4a2d3a; color: #ffb3c8; }
  .face .no { font-weight: 800; letter-spacing: 2px; font-size: 18px; color: #8a6a1f; }
  .face .emo { font-size: 64px; }
  .face .nm { font-weight: 900; font-size: 22px; }
  .face .en { font-size: 13px; color: #7a6f90; }
  .reading { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; width: 100%; min-height: 150px; line-height: 1.6; }
  .reading .title { font-weight: 900; font-size: 19px; }
  .reading .dir { display: inline-block; font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
  .reading .dir.up { background: #2d4a35; color: #9fe6b0; }
  .reading .dir.rev { background: #4a2d3a; color: #ffb3c8; }
  .reading .kw { color: var(--muted); font-size: 15px; margin: 4px 0 6px; }
  .reading .revnote { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
  .reading .tap { color: var(--muted); text-align: center; padding-top: 44px; }

  .summary { margin-top: 26px; background: var(--panel); border: 2px solid var(--topic); border-radius: 20px; padding: 22px 24px; }
  .summary h2 { margin: 0 0 6px; font-size: 26px; }
  .stars { font-size: 30px; color: var(--gold); letter-spacing: 3px; }
  .summary p { line-height: 1.7; margin: 10px 0; font-size: 19px; }
  .lucky { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .lucky div { background: var(--panel2); border-radius: 12px; padding: 10px 12px; text-align: center; }
  .lucky b { display: block; color: var(--topic); font-size: 14px; margin-bottom: 2px; }

  @media (max-width: 860px) {
    .topics, .spread { grid-template-columns: 1fr; }
    .deck { grid-template-columns: repeat(6, 1fr); }
    .hero h1 { font-size: 44px; }
    .lucky { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 시작: 운세 고르기 -->
  <section id="start" class="screen active">
    <div class="hero">
      <div class="moon">🔮</div>
      <h1>오늘의 타로</h1>
      <p>궁금한 운세를 고르고, 마음이 가는 카드 3장을 뽑아 보세요.</p>
    </div>
    <div class="topics" id="topics"></div>
    <div class="note">타로는 재미로 보는 운세예요. 좋은 말은 믿고, 나쁜 말은 조심하라는 뜻으로 받아들여 주세요 🙂</div>
  </section>

  <!-- 카드 고르기 -->
  <section id="pick" class="screen">
    <div class="head">
      <span class="pill" id="pickTopic"></span>
      <button class="btn ghost" id="backBtn">← 운세 다시 고르기</button>
    </div>
    <div class="guide">마음속으로 질문을 떠올리고 카드 3장을 고르세요
      <small>고른 순서대로 <span id="posGuide"></span> 자리에 놓여요</small>
    </div>
    <div class="count" id="pickCount"></div>
    <div class="deck" id="deck"></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen">
    <div class="head">
      <span class="pill" id="resTopic"></span>
      <button class="btn ghost" id="openAllBtn">모두 뒤집기</button>
    </div>
    <div class="guide">카드를 눌러 한 장씩 뒤집어 보세요</div>
    <div class="spread" id="spread"></div>
    <div class="summary" id="summary" hidden></div>
    <div class="row" id="endBtns" hidden>
      <button class="btn" id="againBtn">🔄 같은 운세 다시 보기</button>
      <button class="btn ghost" id="homeBtn">다른 운세 고르기</button>
    </div>
  </section>

</div>

마지막 한 걸음"], "score": [5, 3], "love": ["완벽한 조화! 오래 바라던 관계가 이루어져요.", "거의 다 왔어요. 마지막 용기가 필요해요."], "study": ["목표 달성! 노력이 결실을 맺어요.", "마무리가 아쉬워요. 끝까지 검토해요."], "money": ["모으던 목표 금액을 달성할 수 있어요.", "조금만 더 참으면 목표에 닿아요."]}], "pickCount": 3, "reversedRate": 0.35};
const { topics: TOPICS, cards: CARDS, pickCount: PICK, reversedRate: REV_RATE } = DATA;
const $ = (id) => document.getElementById(id);
const randomOf = (arr) => arr[Math.floor(Math.random() * arr.length)];
// 받침이 있으면 "이에요", 없으면 "예요" (예: 별이에요, 바보예요)
const ieyo = (word) => {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  return code >= 0 && code <= 11171 && code % 28 !== 0 ? "이에요" : "예요";
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

let state = null;

// ---------- 1. 운세 고르기 ----------
function chooseTopic(key) {
  const t = TOPICS[key];
  document.body.dataset.topic = key;
  state = { topic: key, deck: shuffle(CARDS.map((_, i) => i)), chosen: [] };
  $("pickTopic").textContent = `${t.emo} ${t.name}`;
  $("posGuide").textContent = t.positions.join(" → ");
  renderDeck();
  show("pick");
}

// ---------- 2. 카드 고르기 ----------
function renderDeck() {
  $("pickCount").textContent = `${state.chosen.length} / ${PICK}장 선택`;
  $("deck").innerHTML = "";
  state.deck.forEach((cardIdx, i) => {
    const b = document.createElement("button");
    b.className = "back";
    b.style.animationDelay = `${i * 0.025}s`;
    b.setAttribute("aria-label", `${i + 1}번째 카드`);
    b.onclick = () => chooseCard(b, cardIdx);
    $("deck").appendChild(b);
  });
}

function chooseCard(btn, cardIdx) {
  if (state.chosen.length >= PICK || btn.classList.contains("chosen")) return;
  btn.classList.add("chosen");
  btn.disabled = true;
  // 정방향 / 역방향은 고르는 순간 정해짐
  state.chosen.push({ idx: cardIdx, reversed: Math.random() < REV_RATE, open: false });
  $("pickCount").textContent = `${state.chosen.length} / ${PICK}장 선택`;
  if (state.chosen.length === PICK) {
    document.querySelectorAll(".back:not(.chosen)").forEach((b) => { b.disabled = true; b.classList.add("dim"); });
    setTimeout(showSpread, 700);
  }
}

// ---------- 3. 카드 펼치기 & 해석 ----------
function showSpread() {
  const t = TOPICS[state.topic];
  $("resTopic").textContent = `${t.emo} ${t.name}`;
  $("summary").hidden = true;
  $("endBtns").hidden = true;
  $("openAllBtn").hidden = false;
  $("spread").innerHTML = state.chosen.map((c, i) => {
    const card = CARDS[c.idx];
    return `<div class="slot-wrap">
      <div class="pos">${i + 1}. ${t.positions[i]}</div>
      <div class="slot" id="slot${i}" role="button" tabindex="0" aria-label="${t.positions[i]} 카드 뒤집기">
        <div class="flip">
          <div class="cover">눌러서 뒤집기</div>
          <div class="face"><div class="inner">
            <div class="no">${card.no}</div>
            <div class="emo">${card.emo}</div>
            <div><div class="nm">${card.name}</div><div class="en">${card.en}</div></div>
          </div></div>
        </div>
      </div>
      <div class="orient" id="orient${i}"></div>
      <div class="reading" id="reading${i}"><div class="tap">👆 카드를 눌러 주세요</div></div>
    </div>`;
  }).join("");
  state.chosen.forEach((_, i) => {
    $("slot" + i).onclick = () => openCard(i);
    $("slot" + i).onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(i); } };
  });
  show("result");
}

// 카드 열기: ① 앞면으로 뒤집기(0.8초) → ② 역방향이면 카드가 180° 돌아 거꾸로 놓임(0.7초) → ③ 해석 표시
const FLIP_MS = 800, TURN_MS = 700;

function openCard(i) {
  const c = state.chosen[i];
  if (c.open) return;
  c.open = true;
  const slot = $("slot" + i);
  slot.classList.add("open");
  slot.setAttribute("aria-disabled", "true");
  if (c.reversed) setTimeout(() => slot.classList.add("turned"), FLIP_MS);
  setTimeout(() => showReading(i), c.reversed ? FLIP_MS + TURN_MS : FLIP_MS * 0.6);
}

function showReading(i) {
  const c = state.chosen[i];
  const card = CARDS[c.idx];
  const d = c.reversed ? 1 : 0;
  const orient = $("orient" + i);
  orient.className = "orient show " + (c.reversed ? "rev" : "up");
  orient.textContent = c.reversed ? "🔄 역방향 · 카드가 거꾸로 나왔어요" : "⬆️ 정방향";
  $("reading" + i).innerHTML =
    `<div class="title">${card.emo} ${card.name}<span class="dir ${c.reversed ? "rev" : "up"}">${c.reversed ? "역방향" : "정방향"}</span></div>` +
    `<div class="kw">${card.key[d]}</div>` +
    `<div>${card[state.topic][d]}</div>` +
    (c.reversed
      ? `<div class="revnote">역방향은 카드의 뜻이 약해지거나 반대로 바뀐다는 의미예요. (정방향일 때: ${card.key[0]})</div>`
      : "");
  c.done = true;
  if (state.chosen.every((x) => x.done)) showSummary();
}

function openAll() {
  state.chosen.forEach((_, i) => setTimeout(() => openCard(i), i * 350));
}

// ---------- 4. 종합 운세 ----------
function showSummary() {
  const t = TOPICS[state.topic];
  const scores = state.chosen.map((c) => CARDS[c.idx].score[c.reversed ? 1 : 0]);
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  const stars = Math.max(1, Math.min(5, Math.round(avg)));
  const tier = avg < 2.7 ? 0 : avg < 3.7 ? 1 : 2;
  const revCount = state.chosen.filter((c) => c.reversed).length;
  const best = state.chosen.reduce((a, c) => (CARDS[c.idx].score[c.reversed ? 1 : 0] > CARDS[a.idx].score[a.reversed ? 1 : 0] ? c : a));
  $("summary").innerHTML =
    `<h2>${t.emo} 오늘의 ${t.name}</h2>` +
    `<div class="stars">${"★".repeat(stars)}${"☆".repeat(5 - stars)}</div>` +
    `<p>${t.summary[tier]}</p>` +
    (revCount ? `<p>거꾸로 나온 카드가 <b>${revCount}장</b> 있어요. 역방향 카드의 말은 '조심하면 좋아진다'는 신호로 받아들이세요.</p>` : "") +
    `<p>가장 힘이 되는 카드는 <b>${CARDS[best.idx].emo} ${CARDS[best.idx].name}</b>${ieyo(CARDS[best.idx].name)}. ${CARDS[best.idx].key[best.reversed ? 1 : 0]}의 기운을 기억하세요.</p>` +
    `<div class="lucky">` +
      `<div><b>행운의 색</b>${randomOf(t.lucky_colors)}</div>` +
      `<div><b>행운의 숫자</b>${1 + Math.floor(Math.random() * 9)}</div>` +
      `<div><b>행운의 아이템</b>${randomOf(t.lucky_items)}</div>` +
    `</div>`;
  $("summary").hidden = false;
  $("endBtns").hidden = false;
  $("openAllBtn").hidden = true;
  setTimeout(() => $("summary").scrollIntoView({ behavior: "smooth", block: "nearest" }), 200);
}

// ---------- 시작 ----------
function init() {
  $("topics").innerHTML = Object.entries(TOPICS).map(([k, t]) =>
    `<button class="topic ${k}" data-key="${k}"><span class="emo">${t.emo}</span><span class="nm">${t.name}</span><span class="ds">${t.desc}</span></button>`
  ).join("");
  document.querySelectorAll(".topic").forEach((b) => { b.onclick = () => chooseTopic(b.dataset.key); });
  $("backBtn").onclick = () => show("start");
  $("homeBtn").onclick = () => { delete document.body.dataset.topic; show("start"); };
  $("againBtn").onclick = () => chooseTopic(state.topic);
  $("openAllBtn").onclick = openAll;
}
init();
</script>
